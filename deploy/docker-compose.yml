services:
  sporgla-app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VITE_POCKETBASE_URL: ""
        VITE_AI_API_URL: ""
        VITE_VAPID_PUBLIC_KEY: ""
    container_name: sporgla-app
    restart: unless-stopped
    environment:
      - TZ=Europe/Istanbul
    volumes:
      - sporgla_pb_data:/app/pb_data
    networks:
      gakademi_default:
        aliases:
          - sporgla-app
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  sporgla_pb_data:
    name: sporgla_pb_data

networks:
  gakademi_default:
    external: true
    name: gakademi_default
